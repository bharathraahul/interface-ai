<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Mock Bank</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f4f6f8; color: #1a2230; display: flex; min-height: 100vh; align-items: center; }
    .card { background: #fff; border: 1px solid #e6e9ef; border-radius: 12px; padding: 28px;
            width: 320px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .muted { color: #6b7280; font-size: 13px; margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: #6b7280; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #e6e9ef;
            border-radius: 8px; font-size: 14px; }
    button { width: 100%; margin-top: 18px; padding: 10px; background: #2563eb; color: #fff;
             border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-size: 13px;
             padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏦 Mock Bank</h1>
    <div class="muted">Sign in to your account</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
